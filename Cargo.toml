[package]
name = "runly"
version = "0.1.0"
edition = "2024"
description = "Neural networks in Rust: MLP, convnets, autograd, Adam on top of the candle tensor engine"
license = "Apache-2.0"
repository = "https://github.com/mel0k1/Runly"
keywords = ["machine-learning", "neural-network", "deep-learning", "autograd", "candle"]
categories = ["science", "algorithms"]
authors = ["mel0k1"]

[dependencies]
candle = { version = "0.11.1", package = "candle-core" }
candle-nn = "0.11.1"
rand = "0.9"
flate2 = { version = "1", optional = true }
ureq = { version = "2", optional = true }

[features]
mnist = ["dep:flate2", "dep:ureq"]
cuda = ["candle/cuda", "candle-nn/cuda"]
